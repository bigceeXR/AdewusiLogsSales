<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Pluto Logs</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
</head>
<body>
  <script src="loader.js"></script>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="brand">⚡ Pluto Logs</a>
      <div class="nav-links">
        <a href="/">Shop</a>
        <span id="cartIcon" class="cart-icon" onclick="window.location='cart'">🛒 <span id="cartCount">0</span></span>
        <button class="btn-outline" onclick="signOut()" style="padding:6px 16px" data-load-text="Signing out...">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- Payment success banner -->
  <div id="successBanner" style="display:none;background:var(--green);color:#fff;text-align:center;padding:14px;font-weight:700;font-size:0.95rem">
    ✅ Payment successful! Your account credentials are now available below.
  </div>

  <div class="container page-section">
    <div class="dash-layout">

      <!-- Sidebar -->
      <div class="dash-sidebar">
        <a href="#purchases" class="active" onclick="showTab('purchases',this)">📦 My Purchases</a>
        <a href="#profile" onclick="showTab('profile',this)">👤 My Profile</a>
      </div>

      <!-- Main content -->
      <div class="dash-content">

        <!-- Purchases Tab -->
        <div id="tab-purchases">
          <h3 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">My Purchases</h3>
          <div id="purchasesContent"></div>
        </div>

        <!-- Profile Tab -->
        <div id="tab-profile" style="display:none">
          <h3 style="font-size:1.2rem;font-weight:800;margin-bottom:20px">My Profile</h3>
          <div id="errMsgP" class="error-msg"></div>
          <div id="successMsgP" style="display:none;background:#dcfce7;color:var(--green);border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:16px"></div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="pName" placeholder="Your full name" />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="pEmail" disabled style="background:var(--gray-100)" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="pPhone" placeholder="+234 800 000 0000" />
          </div>
          <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="pDob" disabled style="background:var(--gray-100)" />
          </div>
          <button class="btn-primary" onclick="saveProfile()" data-load-text="Saving changes...">Save Changes</button>
        </div>
      <div>
        <hr style="border:none;border-top:1px solid var(--gray-100);margin:28px 0" />
<button class="btn-outline" onclick="toggleChangePassword()" id="togglePwBtn" style="width:100%">
  🔑 Change Password
</button>

<div id="changePwSection" style="display:none;margin-top:20px">
  <h4 style="font-size:1rem;font-weight:800;margin-bottom:16px">Change Password</h4>
  <div id="errMsgPw" class="error-msg"></div>
  <div id="successMsgPw" style="display:none;background:#dcfce7;color:var(--green);border-radius:8px;padding:10px 14px;font-size:0.85rem;margin-bottom:16px"></div>
  <div class="form-group">
    <label>New Password</label>
    <input type="password" id="newPw" placeholder="Min. 8 characters" data-min-length="8" />
  </div>
  <div class="form-group">
    <label>Confirm New Password</label>
    <input type="password" id="confirmPw" placeholder="Repeat new password" />
  </div>
  <button class="btn-primary" onclick="changePassword()" data-load-text="Updating...">Update Password</button>
</div>
      </div>    
      </div>
    </div>
  </div>
 <a href="https://t.me/PLUTOLOGSS/" target="_blank" class="whatsapp-btn" title="Chat on Telegram">

</a>

  <div id="toast" class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="cart.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
