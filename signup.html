<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | Pluto Logs</title>
  
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="loader.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
</head>
<body>
  <script src="loader.js"></script>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="brand">⚡ Pluto Logs</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <h2>Create Account</h2>
      <p class="sub">Join Pluto Logs to purchase premium social accounts</p>

      <div id="step1">
        <div id="errMsg" class="error-msg"></div>
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" id="firstName" placeholder="John" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lastName" placeholder="Doe" />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="phone" placeholder="+234 800 000 0000" />
        </div>
        <div class="form-group">
          <label>Date of Birth <span style="color:var(--gray-500);font-weight:400">(must be 18+)</span></label>
          <input type="date" id="dob" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Min. 8 characters" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat password" />
        </div>
        <button class="btn-primary" onclick="startSignup()" data-load-text="Creating account...">Continue →</button>
        <div class="auth-switch">Already have an account? <a href="login">Sign in</a></div>
      </div>

      <div id="step2" style="display:none">
        <p style="margin-bottom:20px;color:var(--gray-700)">We sent a 8-digits OTP to <strong id="otpEmail"></strong>. Enter it below to verify your account.</p>
        <div id="errMsg2" class="error-msg"></div>
        <div class="otp-inputs" id="otpInputs">
          <input maxlength="1" /><input maxlength="1" /><input maxlength="1" /><input maxlength="1" />
          <input maxlength="1" /><input maxlength="1" /><input maxlength="1" /><input maxlength="1" />
        </div>
        <button class="btn-primary" onclick="verifyOtp()" data-load-text="Verifying...">Verify & Create Account</button>
        <p style="text-align:center;margin-top:14px;font-size:0.85rem;color:var(--gray-500)">
          Didn't receive it? <a href="#" onclick="resendOtp()" style="color:var(--blue);font-weight:700">Resend OTP</a>
        </p>
      </div>
    </div>
  </div>
 <a href="https://t.me/PLUTOLOGSS/" target="_blank" class="fab fab-support" title="Chat on Telegram">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white" width="26" height="26">
    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
  </svg>
</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="signup.js"></script>
</body>
</html>
